l_japanese:
 # Focus Tree
 oct_leech_brothers_expansion:0 "リーチ兄弟の軍拡プログラム"
 oct_leech_brothers_expansion_desc:0 "ジェイドとフロイドによる、オクタヴィネル寮の軍事力強化計画を開始します。\nアズール「僕の手足となって働いてもらいますよ。……慈悲深い僕に感謝してくださいね？」"
 oct_jade_mountain_corps:0 "ジェイドの山岳部隊創設"
 oct_jade_mountain_corps_desc:0 "「山を愛する会」の活動の一環として、山岳戦の専門家を育成します。\nジェイド「山は良いですよ。足場が悪く、視界も悪い……ふふ、獲物を追い詰めるには最高の環境です」"
 oct_mountain_marines:0 "山岳水兵"
 oct_mountain_marines_desc:0 "山も海も制覇するための、特殊な水陸両用部隊です。\nジェイド「海から上陸し、そのまま山頂まで制圧する。……逃げ場など、どこにもありませんよ」"
 oct_buy_infantry_tech:0 "歩兵技術の購入"
 oct_buy_infantry_tech_desc:0 "手っ取り早く最新装備を買い揃えます。金ならありますから。\nジェイド「研究に時間をかけるなどナンセンスです。……対価さえ払えば、最新鋭の武器も即座に手に入りますから」"
 oct_research_institute:0 "研究所の建設"
 oct_research_institute_desc:0 "長期的な利益のために、自前の研究施設を建設します。\nジェイド「独自の技術力を持つことは、交渉において強力なカードになります。……先行投資は惜しみませんよ」"
 oct_jade_mountain_training:0 "ジェイドの山岳訓練"
 oct_jade_mountain_training_desc:0 "極限状態でのサバイバル訓練を行います。\nジェイド「水も食料もない極限状態……そこでしか見られない、美しい表情があるのですよ」"
 oct_foraging:0 "山菜狩り"
 oct_foraging_desc:0 "現地調達の極意を学びます。\nジェイド「おや、こんなところに珍しいキノコが。……毒があるかどうか、誰かで試してみましょうか」"
 oct_floyd_pirate_corps:0 "フロイドの海賊部隊"
 oct_floyd_pirate_corps_desc:0 "「ねえねえ、海賊ごっこしよ〜！」\nフロイドが楽しそうに海軍を指揮し始めました。"
 oct_surface_fleet:0 "水上艦隊"
 oct_surface_fleet_desc:0 "派手なドンパチができる船を揃えます。\nフロイド「ねえねえ、あのでっかい大砲撃っていい？ ドカーンって！ ……え、ダメなの？ つまんね」"
 oct_submarine_fleet:0 "潜水艦隊"
 oct_submarine_fleet_desc:0 "こっそり近づいて沈めるのが楽しいんです。\nフロイド「海の中でじーっと待って……獲物が来たらガブッてやるの。……あはっ、楽しそ〜♪」"
 oct_shore_threat:0 "陸への脅し"
 oct_shore_threat_desc:0 "海から陸地を威圧します。\nフロイド「陸にいる小エビちゃんたち、オレらが海から見てるって知ったら……どんな顔するかなぁ？」"
 oct_mass_prod_subs:0 "量産型潜水艦"
 oct_mass_prod_subs_desc:0 "質より量で圧倒します。\nフロイド「一匹ずつ捕まえるのめんどくさいじゃん。……わらわら〜って囲んで、一気に絞めちゃお？」"
 oct_shock_the_heart:0 "ショック・ザ・ハート"
 oct_shock_the_heart_desc:0 "逃げ惑う獲物を確実に仕留めます。\nフロイド「はい、捕ま〜えた♡ ……もう逃げらんねーよ？ ギュッてしてあげる」"
 oct_floyd_cooking:0 "フロイドのお料理コーナー"
 oct_floyd_cooking_desc:0 "「オレがとびきりの料理を作ってやるよ！」\nフロイドがキッチンに立ちました。嫌な予感がします。"
 
 # Ideas
 OCT_buying_infantry_tech_cost:0 "歩兵技術の購入費用"
 OCT_building_research_institute_cost:0 "研究所建設費用"
 OCT_building_surface_fleet_cost:0 "艦隊建造費用"
 OCT_building_submarine_fleet_cost:0 "潜水艦建造費用"
 oct_mercy_spirit:0 "オクタヴィネルの慈悲"
 
 # Decisions
 oct_jade_food_decisions:0 "ジェイドの食材調達"
 oct_jade_food_decisions_desc:0 "ジェイド「モストロ・ラウンジの運営には新鮮な食材が欠かせません。……さあ、山へ『収穫』に行きましょうか」"
 oct_procure_food_pp:0 "政治力で食材調達"
 oct_procure_food_guns:0 "狩猟による食材調達"
  
 oct_floyd_cooking_decisions:0 "フロイドのキッチン"
 oct_floyd_cooking_decisions_desc:0 "フロイド「今日は何作ろっかな〜？ これとこれ入れたらどうなるんだろ？ ……あはっ！ やってみよーぜ」"
 oct_buy_ingredients:0 "高級食材の購入"
 oct_cook_meal:0 "フロイドの特製まかない"
 
 # Custom Tooltips
 oct_leech_brothers_expansion_tt:0 "§Y国民精神『オクタヴィネルの慈悲』§!を付与します。\nこの国民精神は、以下のNFを達成するたびに効果が強化・追加されていきます。"
 oct_jade_mountain_corps_tt:0 "ジェイド「山岳戦の基礎を叩き込みました」\n§Y[オクタヴィネルの慈悲]の効果を強化:§!\n  §G陸軍経験値獲得: +10%§!"
 oct_mountain_marines_tt:0 "ジェイド「これで海からの強襲も可能です」\n§Y[オクタヴィネルの慈悲]の効果を強化:§!\n  §G特殊部隊攻撃: +10%§!\n  §G特殊部隊防御: +10%§!"
 oct_buy_infantry_tech_cost_tt:0 "ジェイド「金銭で時間を買っているのです。安いものですよ」\n§R[コスト] このNFの進行中、消費財工場が4増加します。§!"
 oct_research_institute_cost_tt:0 "ジェイド「将来のための投資です。今は耐え忍ぶ時ですよ」\n§R[コスト] このNFの進行中、消費財工場が12増加します。§!"
 oct_jade_mountain_training_tt:0 "ジェイド「少ない物資で戦う術を身につけさせました」\n§Y[オクタヴィネルの慈悲]の効果を強化:§!\n  §G補給物資消費: -15%§!"
 oct_foraging_tt:0 "ジェイド「キノコ狩りの準備は万端です」\n§Yディシジョンカテゴリ『ジェイドの食材調達』を解禁します。§!"
 oct_surface_fleet_cost_tt:0 "フロイド「アズールが金出すって言うからさ〜」\n§R[コスト] このNFの進行中、消費財工場が増加します。§!"
 oct_submarine_fleet_cost_tt:0 "フロイド「これ買ってよ。ねえ、いいでしょ？」\n§R[コスト] このNFの進行中、消費財工場が増加します。§!"
 oct_shore_threat_tt:0 "フロイド「ドカーン！ってやって脅かそ？」\n§Y[オクタヴィネルの慈悲]の効果を強化:§!\n  §G艦砲射撃: +40%§!"
 oct_mass_prod_subs_tt:0 "フロイド「もっといっぱい作って、海を埋め尽くそーぜ」\n§Y[オクタヴィネルの慈悲]の効果を強化:§!\n  §G潜水艦生産コスト: -10%§!"
 oct_shock_the_heart_tt:0 "フロイド「逃げても無駄だよ？ ギュッてしてあげる♡」\n§Y[オクタヴィネルの慈悲]の効果を強化:§!\n  §G魚雷命中率: +30%§!"
 oct_floyd_cooking_tt:0 "フロイド「オレの料理、食いたいんでしょ？」\n§Yディシジョンカテゴリ『フロイドのキッチン』を解禁します。§!"
 
 # Decision Events
 OCT_decisions.1.t:0 "食材調達の成果"
 OCT_decisions.1.d:0 "ジェイド「おや、これはなかなか良いキノコ……いえ、食材ですね。これならアズールも喜ぶでしょう」\n\n§Y効果:§! 変数 §Y[オクタヴィネルの食料備蓄]§! が増加しました。"
 OCT_decisions.1.a:0 "上々ですね"
 OCT_decisions.1.b:0 "これは素晴らしい！"
 
 OCT_decisions.2.t:0 "狩猟の成果"
 OCT_decisions.2.d:0 "ジェイド「ふふふ、逃げ足の速い獲物でしたが……私の敵ではありませんでした。さあ、持ち帰りましょうか」\n\n§Y効果:§! 変数 §Y[オクタヴィネルの食料備蓄]§! が増加しました。"
 OCT_decisions.2.a:0 "悪くない"
 OCT_decisions.2.b:0 "大漁だ！"
 
 OCT_decisions.10.t:0 "フロイドの気まぐれクッキング"
 OCT_decisions.10.d:0 "フロイド「ほら、食ってみろよ！ オレの自信作！ ……残したら絞めるからね？」\n\n出された料理は、形容しがたい色をしている...\n\n§Y効果:§! 変数 §Y[オクタヴィネルの食料備蓄]§! を1消費し、結果に応じた政治力を得ます。"
 OCT_decisions.10.a:0 "ぐっ……（大失敗: 政治力 -25）"
 OCT_decisions.10.b:0 "もぐ……まあ、食えるな（普通: 政治力 +25）"
 OCT_decisions.10.c:0 "美味い！ 意外といける！（成功: 政治力 +50）"
 OCT_decisions.10.d:0 "なんだこれ！？ 最高に美味いぞ！！（大成功: 政治力 +150）"
