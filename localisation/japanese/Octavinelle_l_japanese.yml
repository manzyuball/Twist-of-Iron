  # ==================================================
  # ディシジョン
  # ==================================================
  OCT_contracts: "Mostro国際契約"
  OCT_contracts_desc: "モストロ・ラウンジを通じて各国に提示される『魅力的な契約』の一覧。もちろん、表紙に書かれていない対価も含めて、漏れなく回収いたします。"

  OCT_offer_uk_financial_deal: "【提案】ロンドン金融・港湾共同事業"
  OCT_offer_uk_financial_deal_desc: "大英帝国に対し、港湾整備と金融支援を組み合わせた共同事業を提案する。彼らの威信を保たせつつ、帝都の動脈にMostroの名を刻み込む絶好の機会だ。"

  OCT_offer_usa_investment: "【提案】アメリカ投資パッケージ"
  OCT_offer_usa_investment_desc: "合衆国に対し、インフラ投資と資本参加を条件とした大型契約を提示する。受け入れられれば、新大陸への常設の入口を手に入れられる。"

  OCT_offer_bra_investment: "【提案】ブラジル開発パッケージ"
  OCT_offer_bra_investment_desc: "ブラジルに対し、港湾整備と観光開発を軸にした包括的パッケージを提示する。リゾートと物流拠点、そのどちらもMostroにとって実においしい案件だ。"

  # ==================================================
  # イベント文言
  # ==================================================
  OCT_uk_deal_1_title: "モストロからの提案"
  OCT_uk_deal_1_desc: "『Mostro・ラウンジ』を名乗る奇妙な勢力から、ロンドン金融街と主要港湾の共同事業に関する提案が届いている。条件は悪くないが、彼らの干渉を許すことにもなる。利益か、警戒か。"
  OCT_uk_deal_1_a: "提案を受け入れよう（利益は大きい）"
  OCT_uk_deal_1_b: "怪しすぎる、断れ。"

  OCT_new_world_usa_title: "新大陸へのMostro投資"
  OCT_new_world_usa_desc: "オクタヴィネル寮は、我が国のインフラと産業への大規模投資を提案している。その資本とノウハウは魅力的だが、一度受け入れれば、彼らの影は深く入り込むだろう。"
  OCT_new_world_bra_title: "ブラジル開発提案"
  OCT_new_world_bra_desc: "オクタヴィネル寮が、我が国の港湾および観光開発への参加を申し出ている。確かに経済は潤うだろう——その見返りさえ、納得できるならば。"

  OCT_new_world_deal_accept: "提案を受諾する"
  OCT_new_world_deal_reject: "提案を拒否する"