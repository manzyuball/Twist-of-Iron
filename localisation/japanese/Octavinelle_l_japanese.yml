l_japanese:
  # ==================================================
  # オクタヴィネル寮 - 国家方針
  # ==================================================
  OCT_the_mostro_lounge: "モストロ・ラウンジ"
  OCT_the_mostro_lounge_desc: "オクタヴィネル寮の心臓部にして、全ての契約が交わされる場所。ここを拠点に、我々はこの世界の『需要』と『弱み』を丁寧に拾い上げ、利益へと変えていく。"

  OCT_premium_services: "プレミアムサービスの展開"
  OCT_premium_services_desc: "表向きは丁寧で上品なサービス。しかしその裏には、相手の喉元を確実に押さえる契約条項が隠されている。満足度と依存度を同時に高めるのが、ビジネスの基本だ。"

  OCT_contract_is_absolute: "契約は絶対"
  OCT_contract_is_absolute_desc: "一度サインした契約は、どんな言い訳でも覆せない。『この世界』にもその原則を教えてあげよう。条文の隅から隅まで、逃げ道は用意しない。"

  OCT_construction_business: "建設事業への進出"
  OCT_construction_business_desc: "港湾、ラウンジ、商業施設。基盤を握る者が、街を支配する。インフラ整備を請け負うことで、相手国の喉をさりげなく押さえるのだ。"

  OCT_urban_development: "沿岸都市開発プロジェクト"
  OCT_urban_development_desc: "モストロ・ブランドの看板を掲げた港湾都市は、やがて多くの船と金を引き寄せる。表向きは発展支援、実態は影響圏の拡大だ。"

  OCT_financial_business: "金融事業への進出"
  OCT_financial_business_desc: "融資、保証、保険、為替。数字の海を泳ぎ切れる者だけが、真の支配者になれる。相手の国家財政を『優しく』サポートしてあげよう。対価込みで。"

  OCT_stock_market: "モストロ証券取引網"
  OCT_stock_market_desc: "株式と債券の網を張り巡らせれば、各国経済の鼓動が手に取るように分かる。相手がくしゃみをする前に、その体温を測ることができるだろう。"

  OCT_retail_business: "小売・サービス網の拡大"
  OCT_retail_business_desc: "表の顔は華やかなショップとカフェ。裏の顔は世論と流行を支配する情報網。楽しく消費してもらいながら、データもいただくとしよう。"

  OCT_resort_development: "海洋リゾート開発"
  OCT_resort_development_desc: "贅沢な時間と引き換えに、財布の紐と心の隙を預かる場所。外交官も軍人も、油断した隙に契約書へサインしてしまうかもしれない。"

  OCT_logistics_network: "物流ネットワーク構築"
  OCT_logistics_network_desc: "輸送と補給の要を押さえれば、どの船が、どの荷を、どこへ運ぶかを選別できる。見返りとして、『安全な航路』を提供してあげよう。"

  OCT_offshore_production: "オフショア生産拠点"
  OCT_offshore_production_desc: "税制、労働力、立地。それらを最大限に利用し、各国の規制をすり抜ける生産拠点を展開する。利益はMostroに、責任は相手国に。"

  OCT_mostro_conglomerate: "モストロ・コングロマリット"
  OCT_mostro_conglomerate_desc: "飲食、建設、金融、物流、観光、軍需。全ての事業がひとつの巨大な傘の下に収束する。もはや一国家に等しい影響力を持つ企業体——それが我々だ。"

  OCT_military_branch: "海洋安全保障部門"
  OCT_military_branch_desc: "契約相手の『安全』を確保するための海軍戦力。それは同時に、契約相手を縛る鎖でもある。守るも沈めるも、こちら次第だ。"

  OCT_floyd_sea_focus: "フロイドの気まぐれ艦隊"
  OCT_floyd_sea_focus_desc: "読めない動きほど厄介なものはない。フロイドの直感的な戦い方は、敵にとって悪夢となり、味方にとっては最高の抑止力となる。"

  OCT_marine_training: "強襲上陸部隊の育成"
  OCT_marine_training_desc: "海と陸の境界を自在に行き来できる精鋭部隊は、Mostroの要求を通すための最も説得力ある『交渉材料』だ。"

  OCT_carrier_operations: "航空戦力の海上展開"
  OCT_carrier_operations_desc: "制空権と制海権を同時に握ることで、契約に応じない者へ別種の説得を行う準備が整う。"

  OCT_target_uk: "大英帝国との特別契約"
  OCT_target_uk_desc: "かつて海を支配したのは彼ら。今後、海を支配するのは我々だ。衝突ではなく『提携』という形で、彼らの喉元にMostroの名を刻もう。"

  OCT_uk_joint_ventures: "ロンドン共同事業"
  OCT_uk_joint_ventures_desc: "港湾・金融・保険市場にMostroが食い込む。彼らにとっては心強い支援、我々にとっては手綱だ。"

  OCT_target_new_world: "新大陸への投資窓口"
  OCT_target_new_world_desc: "豊富な資源と成長市場。新大陸の国家たちは、魅力的な『お客様』になりうる。適切な契約を用意しよう。"

  OCT_americas_conglomerate_network: "新大陸投資ネットワーク"
  OCT_americas_conglomerate_network_desc: "複数の契約が一本の管で繋がり、利益は全て我々のもとへ流れ込む。表向きはWIN-WIN、実際は…。"

  # ==================================================
  # オクタヴィネル寮 - 国民精神
  # ==================================================
  OCT_Mostro_Lounge: "モストロ・ラウンジ"
  OCT_Mostro_Lounge_desc: "寮生たちが働くラウンジは、情報と契約が集まる中心地。丁寧なサービスの裏で、世界の動向を静かに観察している。"

  OCT_Mostro_Premium_Services: "プレミアムサービス"
  OCT_Mostro_Premium_Services_desc: "特別待遇、会員制度、柔軟な融資——それらは全て、顧客を逃がさないための優雅な鎖。"

  OCT_Mostro_Contract_Economy: "契約経済モデル"
  OCT_Mostro_Contract_Economy_desc: "契約条項こそが秩序であり、利益であり、支配の道具。紙切れ一枚で国家の進路すら変えられる。"

  OCT_Mostro_Construction_Division: "Mostro建設部門"
  OCT_Mostro_Construction_Division_desc: "港湾と施設建設を請け負うことで、インフラを握り、恩を売り、依存させる。"

  OCT_Mostro_Financial_Division: "Mostro金融部門"
  OCT_Mostro_Financial_Division_desc: "巧みな資金運用と保証契約により、各国の財政に静かに食い込む。"

  OCT_Mostro_Financial_Market: "Mostro証券網"
  OCT_Mostro_Financial_Market_desc: "世界各地の市場に張り巡らされた金融ネットワーク。数字の波が、そのままMostroへの利益となる。"

  OCT_Mostro_Retail_Tourism: "小売・観光ネットワーク"
  OCT_Mostro_Retail_Tourism_desc: "華やかな店舗と観光施設が、自然と人と金と噂を集めてくる。"

  OCT_Mostro_Resort_Program: "海洋リゾートプログラム"
  OCT_Mostro_Resort_Program_desc: "贅沢なリゾートは、富裕層と権力者をもてなしながら、彼らの弱点を静かに観察する舞台でもある。"

  OCT_Mostro_Logistics_Shipping: "物流・海運統制"
  OCT_Mostro_Logistics_Shipping_desc: "物資と船舶の流れを把握することで、有事の際、誰を助け、誰を見捨てるかを選べる。"

  OCT_Mostro_Offshore_Production: "オフショア生産網"
  OCT_Mostro_Offshore_Production_desc: "各国の法の隙間を縫う工場群。利益はMostroへ、責任は境界線の外へ。"

  OCT_Mostro_Conglomerate: "モストロ・コングロマリット"
  OCT_Mostro_Conglomerate_desc: "多角化を極めた巨大企業体。いまや一つの国家と同等か、それ以上の経済力と影響力を持つ。"

  OCT_Mostro_Naval_Base: "海洋安全保障ネットワーク"
  OCT_Mostro_Naval_Base_desc: "護衛と制裁を同時に行える海軍力。契約相手の海路を保証する代わりに、条件を上乗せできる。"

  OCT_Floyd_Sea_Doctrine: "フロイド式海戦術"
  OCT_Floyd_Sea_Doctrine_desc: "予測不能な機動と容赦ない追撃。敵にとっては悪夢、味方にとっても扱い注意。"

  OCT_Mostro_Marines: "Mostro海兵隊"
  OCT_Mostro_Marines_desc: "交渉が決裂したときに前に出る者たち。契約書の最後の一行、『その他必要な措置』の具現化。"

  OCT_Mostro_Carrier_Group: "モストロ空母打撃群"
  OCT_Mostro_Carrier_Group_desc: "空と海からの圧力で、あらゆる契約を『説得力』をもって提示できる。"

  # ==================================================
  # ディシジョン
  # ==================================================
  OCT_contracts: "Mostro国際契約"
  OCT_contracts_desc: "モストロ・ラウンジを通じて各国に提示する『魅力的な契約』の一覧。もちろん、対価はきっちり頂きます。"

  OCT_offer_uk_financial_deal: "【提案】ロンドン金融・港湾共同事業"
  OCT_offer_uk_financial_deal_desc: "大英帝国に対し、港湾整備と金融支援の共同事業を提案する。彼らの威信を保ちつつ、我々の影響力を深く浸透させることができるだろう。"

  OCT_offer_usa_investment: "【提案】アメリカ投資パッケージ"
  OCT_offer_usa_investment_desc: "合衆国に対し、インフラ投資と資本参加を条件とした大型契約を持ちかける。彼らが受け入れれば、新大陸の入り口を確保できる。"

  OCT_offer_bra_investment: "【提案】ブラジル開発パッケージ"
  OCT_offer_bra_investment_desc: "ブラジルに対して港湾・産業開発計画を提示する。リゾートと物流拠点、どちらもMostroにとっておいしい案件だ。"

  # ==================================================
  # イベント文言
  # ==================================================
  OCT_uk_deal_1_title: "モストロからの提案"
  OCT_uk_deal_1_desc: "『Mostro・ラウンジ』を名乗る奇妙な勢力から、ロンドン金融街と港湾の共同事業に関する提案が届いている。条件は悪くないが、彼らの干渉を許すことにもなる…。"
  OCT_uk_deal_1_a: "提案を受け入れよう（利益は大きい）"
  OCT_uk_deal_1_b: "怪しすぎる、断れ。"

  OCT_new_world_usa_title: "新大陸へのMostro投資"
  OCT_new_world_usa_desc: "オクタヴィネル寮は、我が国のインフラと産業への投資を提案している。彼らの資本とノウハウは魅力的だが、その意図は計り知れない。"
  OCT_new_world_bra_title: "ブラジル開発提案"
  OCT_new_world_bra_desc: "オクタヴィネル寮が、我が国の港湾・観光開発への参加を申し出ている。これを受け入れれば、経済は潤うだろうが…。"

  OCT_new_world_deal_accept: "提案を受諾する"
  OCT_new_world_deal_reject: "提案を拒否する"